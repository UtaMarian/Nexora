# Serves the web app and proxies the API, so browser and API share one origin (session cookie + CSRF).
server {
    listen 80;
    server_name _;
    client_max_body_size 4g;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # stream large uploads
        proxy_buffering off;           # stream large downloads
        proxy_read_timeout 3600s;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes such as /sites/hr/Shared Documents fall back to the app.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
