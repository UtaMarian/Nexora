# NEXORA single-host install: PostgreSQL, S3 object storage (SeaweedFS), Office editor (Collabora Online),
# API server and web app.
#
#   cp .env.example .env    # set real passwords
#   docker compose up -d --build
#   open http://localhost:8088
#
# Production installs can point NEXORA at an existing S3 store (Ceph, NetApp, Dell ECS, AWS) instead of SeaweedFS.
name: nexora

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${NEXORA_DB_PASSWORD:?set NEXORA_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.45
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/start.sh"]
    environment:
      S3_ACCESS_KEY: ${NEXORA_S3_ACCESS_KEY:?set NEXORA_S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${NEXORA_S3_SECRET_KEY:?set NEXORA_S3_SECRET_KEY in .env}
    volumes:
      - ./seaweedfs/start.sh:/start.sh:ro
      - blob-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Collabora Online (CODE): browser editing and real-time co-authoring of Word, Excel and PowerPoint files.
  collabora:
    image: collabora/code:26.04.5.1.1
    restart: unless-stopped
    cap_add:
      - MKNOD
    environment:
      # WOPI hosts allowed to serve documents: the backend container, and a backend run outside Docker (dev).
      aliasgroup1: http://backend:8080
      aliasgroup2: http://host.docker.internal:8080
      # Host and port browsers use to reach the editor.
      server_name: ${NEXORA_OFFICE_PUBLIC_HOST:-localhost:9980}
      username: admin
      password: ${NEXORA_OFFICE_ADMIN_PASSWORD:?set NEXORA_OFFICE_ADMIN_PASSWORD in .env}
      dictionaries: en_US en_GB de_DE fr_FR es_ES it_IT ro_RO
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=false
        --o:net.frame_ancestors=${NEXORA_OFFICE_FRAME_ANCESTORS:-localhost:*}
        --o:welcome.enable=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NEXORA_OFFICE_PORT:-9980}:9980"

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      s3: { condition: service_healthy }
      collabora: { condition: service_started }
    environment:
      NEXORA_DB_URL: jdbc:postgresql://db:5432/nexora
      NEXORA_DB_USER: nexora
      NEXORA_DB_PASSWORD: ${NEXORA_DB_PASSWORD}
      NEXORA_STORAGE_TYPE: s3
      NEXORA_S3_ENDPOINT: http://s3:8333
      NEXORA_S3_BUCKET: nexora
      NEXORA_S3_ACCESS_KEY: ${NEXORA_S3_ACCESS_KEY}
      NEXORA_S3_SECRET_KEY: ${NEXORA_S3_SECRET_KEY}
      NEXORA_OFFICE_ENABLED: "true"
      NEXORA_OFFICE_DISCOVERY_URL: http://collabora:9980/hosting/discovery
      NEXORA_WOPI_HOST_URL: http://backend:8080
      NEXORA_WOPI_TOKEN_SECRET: ${NEXORA_WOPI_TOKEN_SECRET:?set NEXORA_WOPI_TOKEN_SECRET in .env}
      NEXORA_BOOTSTRAP_ADMIN_PASSWORD: ${NEXORA_BOOTSTRAP_ADMIN_PASSWORD:?set NEXORA_BOOTSTRAP_ADMIN_PASSWORD in .env}
      NEXORA_DEMO_DATA: ${NEXORA_DEMO_DATA:-false}
      NEXORA_SECURE_COOKIES: ${NEXORA_SECURE_COOKIES:-false}

  web:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${NEXORA_HTTP_PORT:-8088}:80"

volumes:
  db-data:
  blob-data:
