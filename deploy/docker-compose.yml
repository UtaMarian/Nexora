# NEXORA single-host install over HTTPS: PostgreSQL, S3 object storage (SeaweedFS), Keycloak (sign-in, AD/LDAP,
# Kerberos, ADFS), Collabora Online (browser Office editing), OpenSearch and Apache Tika (full-text search and OCR),
# API server and web app.
#
#   cp .env.example .env              # set real passwords and your host name
#   ./scripts/make-dev-certs.sh       # or put your own tls.crt / tls.key in ./certs
#   docker compose up -d --build
#   open https://localhost:8443
#
# Production installs can point NEXORA at an existing S3 store (Ceph, NetApp, Dell ECS, AWS) instead of SeaweedFS.
name: nexora

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${NEXORA_DB_PASSWORD:?set NEXORA_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:4.45
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/start.sh"]
    environment:
      S3_ACCESS_KEY: ${NEXORA_S3_ACCESS_KEY:?set NEXORA_S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${NEXORA_S3_SECRET_KEY:?set NEXORA_S3_SECRET_KEY in .env}
    volumes:
      - ./seaweedfs/start.sh:/start.sh:ro
      - blob-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---- identity ----------------------------------------------------------------------------------------------

  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Keycloak: OIDC provider for NEXORA; federates AD/LDAP (users, groups, Kerberos) and brokers ADFS (SAML).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    command:
      - start
      - --http-enabled=true
      - --http-relative-path=/auth
      - --hostname=https://${NEXORA_PUBLIC_HOST:-localhost:8443}/auth
      - --hostname-backchannel-dynamic=true
      - --proxy-headers=xforwarded
      - --health-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Kerberos: point Java at your realm, e.g. -Djava.security.krb5.conf=/opt/keycloak/conf/nexora/krb5.conf
      JAVA_OPTS_APPEND: ${KEYCLOAK_JAVA_OPTS:-}
    volumes:
      # Kerberos keytab (nexora.keytab) and krb5.conf for SPNEGO single sign-on, when used
      - ./keycloak:/opt/keycloak/conf/nexora:ro
    depends_on:
      keycloak-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # One-shot, idempotent Keycloak setup (realm, clients, AD/LDAP, Kerberos, ADFS). Holds the Keycloak master
  # admin password so the long-running NEXORA server never has to.
  keycloak-provision:
    image: nexora/backend:local
    restart: "no"
    entrypoint: ["java", "-cp", "/opt/nexora/nexora.jar", "-Dloader.main=io.nexora.tools.KeycloakProvisioner",
                 "org.springframework.boot.loader.launch.PropertiesLauncher"]
    depends_on:
      keycloak: { condition: service_healthy }
      ldap: { condition: service_started, required: false }
    environment:
      KC_URL: http://keycloak:8080/auth
      KC_ADMIN: admin
      KC_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      REALM: nexora
      PUBLIC_URL: https://${NEXORA_PUBLIC_HOST:-localhost:8443}
      OIDC_CLIENT_SECRET: ${NEXORA_OIDC_CLIENT_SECRET:?set NEXORA_OIDC_CLIENT_SECRET in .env}
      SYNC_CLIENT_SECRET: ${NEXORA_SYNC_CLIENT_SECRET:?set NEXORA_SYNC_CLIENT_SECRET in .env}
      ADMIN_GROUP: ${NEXORA_ADMIN_GROUP:-NEXORA Admins}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_VENDOR: ${LDAP_VENDOR:-ad}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_USERS_DN: ${LDAP_USERS_DN:-}
      LDAP_GROUPS_DN: ${LDAP_GROUPS_DN:-}
      KERBEROS_REALM: ${KERBEROS_REALM:-}
      KERBEROS_PRINCIPAL: ${KERBEROS_PRINCIPAL:-}
      KERBEROS_KEYTAB: /opt/keycloak/conf/nexora/nexora.keytab
      ADFS_METADATA_URL: ${ADFS_METADATA_URL:-}
      ADFS_ALIAS: ${ADFS_ALIAS:-adfs}
      ADFS_DISPLAY_NAME: ${ADFS_DISPLAY_NAME:-ADFS}

  # Demo directory to try AD/LDAP federation without a domain controller: docker compose --profile demo-directory up
  ldap:
    image: osixia/openldap:1.5.0
    profiles: ["demo-directory"]
    restart: unless-stopped
    command: --copy-service
    environment:
      LDAP_ORGANISATION: NEXORA Demo
      LDAP_DOMAIN: corp.nexora.test
      LDAP_ADMIN_PASSWORD: ${LDAP_BIND_PASSWORD:-demo-ldap-admin}
      LDAP_TLS: "false"
    volumes:
      - ./ldap/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-seed.ldif:ro

  # ---- office ------------------------------------------------------------------------------------------------

  # Collabora Online (CODE): browser editing and real-time co-authoring. Served through the web container's TLS.
  collabora:
    image: collabora/code:26.04.5.1.1
    restart: unless-stopped
    cap_add:
      - MKNOD
    environment:
      # WOPI hosts allowed to serve documents: the backend container, and a backend run outside Docker (dev).
      aliasgroup1: http://backend:8080
      aliasgroup2: http://host.docker.internal:8080
      server_name: ${NEXORA_PUBLIC_HOST:-localhost:8443}
      username: admin
      password: ${NEXORA_OFFICE_ADMIN_PASSWORD:?set NEXORA_OFFICE_ADMIN_PASSWORD in .env}
      dictionaries: en_US en_GB de_DE fr_FR es_ES it_IT ro_RO
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=true
        --o:net.frame_ancestors=${NEXORA_OFFICE_FRAME_ANCESTORS:-localhost:*}
        --o:welcome.enable=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9980:9980"   # for a backend run outside Docker (development) only

  # ---- search ------------------------------------------------------------------------------------------------

  # Full-text index. It only holds copies, so losing this volume costs a rebuild, not data. No port is published:
  # the security plugin is off and the Compose network is its boundary.
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms${NEXORA_OPENSEARCH_HEAP:-1g} -Xmx${NEXORA_OPENSEARCH_HEAP:-1g}
    volumes:
      - search-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Reads PDF and Office files and runs OCR. It handles untrusted files, so it runs apart from the API, with a
  # memory limit. Languages: put the main one first, for example ron+eng, and see docs/search.md.
  tika:
    build: ./tika
    image: nexora/tika:local
    restart: unless-stopped
    command: ["-c", "/opt/tika-config.json"]
    environment:
      NEXORA_OCR_LANGUAGES: ${NEXORA_OCR_LANGUAGES:-eng}
    mem_limit: ${NEXORA_TIKA_MEMORY:-4g}

  # Catches all email for testing and shows it at http://localhost:8025. To send real email, point NEXORA_SMTP_HOST
  # at your mail server in .env and remove this service.
  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  # ---- NEXORA --------------------------------------------------------------------------------------------------

  backend:
    build: ../backend
    image: nexora/backend:local
    restart: unless-stopped
    volumes:
      - backup-data:/var/lib/nexora/backups
    depends_on:
      db: { condition: service_healthy }
      s3: { condition: service_healthy }
      keycloak-provision: { condition: service_completed_successfully }
      collabora: { condition: service_started }
      opensearch: { condition: service_started }
      tika: { condition: service_started }
    environment:
      NEXORA_DB_URL: jdbc:postgresql://db:5432/nexora
      NEXORA_DB_USER: nexora
      NEXORA_DB_PASSWORD: ${NEXORA_DB_PASSWORD}
      NEXORA_STORAGE_TYPE: s3
      NEXORA_S3_ENDPOINT: http://s3:8333
      NEXORA_S3_BUCKET: nexora
      NEXORA_S3_ACCESS_KEY: ${NEXORA_S3_ACCESS_KEY}
      NEXORA_S3_SECRET_KEY: ${NEXORA_S3_SECRET_KEY}
      NEXORA_OFFICE_ENABLED: "true"
      NEXORA_OFFICE_DISCOVERY_URL: http://collabora:9980/hosting/discovery
      NEXORA_WOPI_HOST_URL: http://backend:8080
      NEXORA_WOPI_TOKEN_SECRET: ${NEXORA_WOPI_TOKEN_SECRET:?set NEXORA_WOPI_TOKEN_SECRET in .env}
      NEXORA_BOOTSTRAP_ADMIN_PASSWORD: ${NEXORA_BOOTSTRAP_ADMIN_PASSWORD:?set NEXORA_BOOTSTRAP_ADMIN_PASSWORD in .env}
      NEXORA_DEMO_DATA: ${NEXORA_DEMO_DATA:-false}
      NEXORA_SECURE_COOKIES: "true"
      # desktop Office sign-in: basic (Windows prompt) or forms (MS-OFBA window with single sign-on)
      NEXORA_OFFICE_SIGN_IN: ${NEXORA_OFFICE_SIGN_IN:-basic}
      NEXORA_BACKUP_DIR: /var/lib/nexora/backups
      NEXORA_SEARCH_ENGINE: opensearch
      NEXORA_OPENSEARCH_URL: http://opensearch:9200
      NEXORA_TIKA_URL: http://tika:9998
      NEXORA_MAIL_ENABLED: ${NEXORA_MAIL_ENABLED:-true}
      NEXORA_SMTP_HOST: ${NEXORA_SMTP_HOST:-mailpit}
      NEXORA_SMTP_PORT: ${NEXORA_SMTP_PORT:-1025}
      NEXORA_SMTP_USER: ${NEXORA_SMTP_USER:-}
      NEXORA_SMTP_PASSWORD: ${NEXORA_SMTP_PASSWORD:-}
      NEXORA_SMTP_STARTTLS: ${NEXORA_SMTP_STARTTLS:-false}
      NEXORA_MAIL_FROM: ${NEXORA_MAIL_FROM:-NEXORA <nexora@nexora.local>}
      NEXORA_PUBLIC_URL: https://${NEXORA_PUBLIC_HOST:-localhost:8443}
      NEXORA_ADMIN_SECRET: ${NEXORA_ADMIN_SECRET:-}
      # troubleshooting sign-in: NEXORA_SECURITY_LOG=DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: ${NEXORA_SECURITY_LOG:-INFO}
      # single sign-on and directory sync through Keycloak
      NEXORA_LOCAL_LOGIN: ${NEXORA_LOCAL_LOGIN:-true}
      NEXORA_OIDC_ENABLED: "true"
      NEXORA_OIDC_DISPLAY_NAME: ${NEXORA_OIDC_DISPLAY_NAME:-Organization account}
      NEXORA_OIDC_PUBLIC_URL: https://${NEXORA_PUBLIC_HOST:-localhost:8443}/auth
      NEXORA_OIDC_INTERNAL_URL: http://keycloak:8080/auth
      NEXORA_OIDC_CLIENT_SECRET: ${NEXORA_OIDC_CLIENT_SECRET}
      NEXORA_OIDC_POST_LOGOUT_URI: https://${NEXORA_PUBLIC_HOST:-localhost:8443}/
      NEXORA_ADMIN_GROUPS: /${NEXORA_ADMIN_GROUP:-NEXORA Admins}
      NEXORA_DIRECTORY_SYNC: "true"
      NEXORA_SYNC_CLIENT_SECRET: ${NEXORA_SYNC_CLIENT_SECRET}
      NEXORA_SYNC_INTERVAL: ${NEXORA_SYNC_INTERVAL:-15m}
      # extra sign-in button for ADFS (brokered by Keycloak); empty alias = no button
      NEXORA_IDENTITY_OIDC_IDENTITYPROVIDERS_0_ALIAS: ${NEXORA_ADFS_BUTTON_ALIAS:-}
      NEXORA_IDENTITY_OIDC_IDENTITYPROVIDERS_0_LABEL: ${NEXORA_ADFS_BUTTON_LABEL:-Sign in with ADFS}

  web:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      - backend
      - keycloak
      - collabora
    environment:
      NEXORA_PUBLIC_HOST: ${NEXORA_PUBLIC_HOST:-localhost:8443}
    volumes:
      - ./certs:/etc/nginx/certs
    ports:
      - "${NEXORA_HTTPS_PORT:-8443}:443"
      - "${NEXORA_HTTP_PORT:-8088}:80"

volumes:
  backup-data:
  db-data:
  blob-data:
  keycloak-data:
  search-data:
