# NEXORA single-host install: PostgreSQL, MinIO (S3), API server and web app.
#
#   cp .env.example .env    # set real passwords
#   docker compose up -d --build
#   open http://localhost:8088
#
name: nexora

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${NEXORA_DB_PASSWORD:?set NEXORA_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${NEXORA_S3_ACCESS_KEY:?set NEXORA_S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${NEXORA_S3_SECRET_KEY:?set NEXORA_S3_SECRET_KEY in .env}
    volumes:
      - blob-data:/data
    ports:
      - "127.0.0.1:9001:9001"   # MinIO console, local access only
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      NEXORA_DB_URL: jdbc:postgresql://db:5432/nexora
      NEXORA_DB_USER: nexora
      NEXORA_DB_PASSWORD: ${NEXORA_DB_PASSWORD}
      NEXORA_STORAGE_TYPE: s3
      NEXORA_S3_ENDPOINT: http://minio:9000
      NEXORA_S3_BUCKET: nexora
      NEXORA_S3_ACCESS_KEY: ${NEXORA_S3_ACCESS_KEY}
      NEXORA_S3_SECRET_KEY: ${NEXORA_S3_SECRET_KEY}
      NEXORA_BOOTSTRAP_ADMIN_PASSWORD: ${NEXORA_BOOTSTRAP_ADMIN_PASSWORD:?set NEXORA_BOOTSTRAP_ADMIN_PASSWORD in .env}
      NEXORA_DEMO_DATA: ${NEXORA_DEMO_DATA:-false}
      NEXORA_SECURE_COOKIES: ${NEXORA_SECURE_COOKIES:-false}

  web:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${NEXORA_HTTP_PORT:-8088}:80"

volumes:
  db-data:
  blob-data:
