spring:
  datasource:
    url: jdbc:h2:mem:nexora-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
nexora:
  storage:
    type: filesystem
    filesystem:
      root: ${java.io.tmpdir}/nexora-test-blobs
  office:
    enabled: true
    discovery-url: http://127.0.0.1:9/hosting/discovery   # nothing listens here: editor "unavailable"
    wopi-host-url: http://nexora.test
    token-secret: test-secret
  mail:
    enabled: true           # mail stays in the outbox: nothing listens here and the worker is off
    host: 127.0.0.1
    port: 9
    worker-enabled: false
    public-url: https://nexora.test
  search:
    engine: lucene
    worker-enabled: false   # SearchTest drains the queue itself
    lucene:
      path: ""              # in memory
  bootstrap:
    admin-login: admin
    admin-password: admin-test-pw
    demo-data: false
logging:
  level:
    nexora.audit: WARN
