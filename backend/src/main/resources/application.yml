# NEXORA server configuration.
# Every value can be overridden with an environment variable, e.g. NEXORA_STORAGE_TYPE=s3,
# SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/nexora.

spring:
  application:
    name: nexora
  datasource:
    url: ${NEXORA_DB_URL:jdbc:postgresql://localhost:5432/nexora}
    username: ${NEXORA_DB_USER:nexora}
    password: ${NEXORA_DB_PASSWORD:nexora}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration/{vendor}
  servlet:
    multipart:
      max-file-size: ${NEXORA_MAX_UPLOAD:4GB}
      max-request-size: ${NEXORA_MAX_UPLOAD:4GB}
      file-size-threshold: 1MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${NEXORA_SECURE_COOKIES:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

nexora:
  storage:
    type: ${NEXORA_STORAGE_TYPE:s3}
    filesystem:
      root: ${NEXORA_STORAGE_ROOT:./data/blobs}
    s3:
      endpoint: ${NEXORA_S3_ENDPOINT:http://localhost:9000}
      region: ${NEXORA_S3_REGION:us-east-1}
      bucket: ${NEXORA_S3_BUCKET:nexora}
      access-key: ${NEXORA_S3_ACCESS_KEY:}
      secret-key: ${NEXORA_S3_SECRET_KEY:}
      path-style: ${NEXORA_S3_PATH_STYLE:true}
      create-bucket: ${NEXORA_S3_CREATE_BUCKET:true}
  sites:
    self-service: ${NEXORA_SELF_SERVICE_SITES:true}
  office:
    # Browser editing and co-authoring through Collabora Online (WOPI).
    enabled: ${NEXORA_OFFICE_ENABLED:true}
    # Where NEXORA reads the editor's capabilities.
    discovery-url: ${NEXORA_OFFICE_DISCOVERY_URL:http://localhost:9980/hosting/discovery}
    # How the editor reaches NEXORA's /wopi endpoints (must be in Collabora's aliasgroup allow-list).
    wopi-host-url: ${NEXORA_WOPI_HOST_URL:http://host.docker.internal:8080}
    token-secret: ${NEXORA_WOPI_TOKEN_SECRET:}
    token-ttl: ${NEXORA_WOPI_TOKEN_TTL:10h}
  bootstrap:
    admin-login: ${NEXORA_BOOTSTRAP_ADMIN_LOGIN:admin}
    admin-password: ${NEXORA_BOOTSTRAP_ADMIN_PASSWORD:}
    demo-data: ${NEXORA_DEMO_DATA:false}

logging:
  level:
    nexora.audit: INFO

---
# Local development without Docker: embedded H2 database file and blobs on disk.
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/nexora;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
nexora:
  storage:
    type: filesystem
  bootstrap:
    admin-password: ${NEXORA_BOOTSTRAP_ADMIN_PASSWORD:admin}
    demo-data: ${NEXORA_DEMO_DATA:true}
