# NEXORA server configuration.
# Every value can be overridden with an environment variable, e.g. NEXORA_STORAGE_TYPE=s3,
# SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/nexora.

spring:
  application:
    name: nexora
  datasource:
    url: ${NEXORA_DB_URL:jdbc:postgresql://localhost:5432/nexora}
    username: ${NEXORA_DB_USER:nexora}
    password: ${NEXORA_DB_PASSWORD:nexora}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration/{vendor}
  servlet:
    multipart:
      max-file-size: ${NEXORA_MAX_UPLOAD:4GB}
      max-request-size: ${NEXORA_MAX_UPLOAD:4GB}
      file-size-threshold: 1MB
  mvc:
    formcontent:
      filter:
        # Would consume form-typed PUT bodies before the WebDAV servlet sees them; the API has no form PUTs.
        enabled: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${NEXORA_SECURE_COOKIES:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

nexora:
  admin:
    backup-dir: ${NEXORA_BACKUP_DIR:./data/backups}
    # encrypts stored SharePoint credentials; falls back to the WOPI token secret
    secret-key: ${NEXORA_ADMIN_SECRET:}
  dav:
    # how desktop Office signs in over WebDAV: basic = the Windows credential prompt (the host must be in Office's
    # "Allow specified hosts to show Basic Authentication prompts" policy), forms = MS-OFBA sign-in window with SSO
    office-sign-in: ${NEXORA_OFFICE_SIGN_IN:basic}
  storage:
    type: ${NEXORA_STORAGE_TYPE:s3}
    filesystem:
      root: ${NEXORA_STORAGE_ROOT:./data/blobs}
    s3:
      endpoint: ${NEXORA_S3_ENDPOINT:http://localhost:9000}
      region: ${NEXORA_S3_REGION:us-east-1}
      bucket: ${NEXORA_S3_BUCKET:nexora}
      access-key: ${NEXORA_S3_ACCESS_KEY:}
      secret-key: ${NEXORA_S3_SECRET_KEY:}
      path-style: ${NEXORA_S3_PATH_STYLE:true}
      create-bucket: ${NEXORA_S3_CREATE_BUCKET:true}
  sites:
    self-service: ${NEXORA_SELF_SERVICE_SITES:true}
  mail:
    # alerts and "shared with you" email
    enabled: ${NEXORA_MAIL_ENABLED:false}
    host: ${NEXORA_SMTP_HOST:localhost}
    port: ${NEXORA_SMTP_PORT:25}
    username: ${NEXORA_SMTP_USER:}
    password: ${NEXORA_SMTP_PASSWORD:}
    from: ${NEXORA_MAIL_FROM:NEXORA <nexora@localhost>}
    start-tls: ${NEXORA_SMTP_STARTTLS:false}
    # the address people use, for links in email
    public-url: ${NEXORA_PUBLIC_URL:http://localhost:5173}
    worker-enabled: ${NEXORA_MAIL_WORKER:true}
  workflow:
    # run rules from this server; turn off on all but one when several share a database
    worker-enabled: ${NEXORA_WORKFLOW_WORKER:true}
  sharing:
    max-link-days: ${NEXORA_SHARE_MAX_LINK_DAYS:365}
  search:
    # lucene = embedded index on this server (development, small single-server installs); opensearch = a cluster
    engine: ${NEXORA_SEARCH_ENGINE:lucene}
    # turn off on all but one server when several share a database
    worker-enabled: ${NEXORA_SEARCH_WORKER:true}
    poll-interval: ${NEXORA_SEARCH_POLL:2s}
    # documents read at the same time; OCR is slow and CPU-heavy
    extract-threads: ${NEXORA_SEARCH_EXTRACT_THREADS:2}
    # larger files are found by name and columns only
    max-file-size: ${NEXORA_SEARCH_MAX_FILE:256MB}
    max-text-chars: ${NEXORA_SEARCH_MAX_TEXT:1000000}
    lucene:
      path: ${NEXORA_SEARCH_LUCENE_PATH:./data/search}
    opensearch:
      url: ${NEXORA_OPENSEARCH_URL:http://localhost:9200}
      index: ${NEXORA_OPENSEARCH_INDEX:nexora-content-v1}
      username: ${NEXORA_OPENSEARCH_USER:}
      password: ${NEXORA_OPENSEARCH_PASSWORD:}
    tika:
      # Apache Tika server for PDF, Office and OCR. Empty = built-in reader for text and modern Office files only.
      url: ${NEXORA_TIKA_URL:}
      timeout: ${NEXORA_TIKA_TIMEOUT:15m}
  identity:
    # Local accounts (bootstrap admin, break-glass). Directory users never have local passwords.
    local-login: ${NEXORA_LOCAL_LOGIN:true}
    oidc:
      # Single sign-on through Keycloak (which federates AD/LDAP, Kerberos and brokers ADFS).
      enabled: ${NEXORA_OIDC_ENABLED:false}
      display-name: ${NEXORA_OIDC_DISPLAY_NAME:Organization account}
      public-url: ${NEXORA_OIDC_PUBLIC_URL:https://localhost:8443/auth}
      internal-url: ${NEXORA_OIDC_INTERNAL_URL:}
      realm: ${NEXORA_OIDC_REALM:nexora}
      client-id: ${NEXORA_OIDC_CLIENT_ID:nexora}
      client-secret: ${NEXORA_OIDC_CLIENT_SECRET:}
      post-logout-redirect-uri: ${NEXORA_OIDC_POST_LOGOUT_URI:}
      admin-groups: ${NEXORA_ADMIN_GROUPS:/NEXORA Admins}
      directory-basic-auth: ${NEXORA_DIRECTORY_BASIC_AUTH:true}
      identity-providers: []
    sync:
      enabled: ${NEXORA_DIRECTORY_SYNC:false}
      client-id: ${NEXORA_SYNC_CLIENT_ID:nexora-sync}
      client-secret: ${NEXORA_SYNC_CLIENT_SECRET:}
      interval: ${NEXORA_SYNC_INTERVAL:15m}
  office:
    # Browser editing and co-authoring through Collabora Online (WOPI).
    enabled: ${NEXORA_OFFICE_ENABLED:true}
    # Where NEXORA reads the editor's capabilities.
    discovery-url: ${NEXORA_OFFICE_DISCOVERY_URL:http://localhost:9980/hosting/discovery}
    # How the editor reaches NEXORA's /wopi endpoints (must be in Collabora's aliasgroup allow-list).
    wopi-host-url: ${NEXORA_WOPI_HOST_URL:http://host.docker.internal:8080}
    token-secret: ${NEXORA_WOPI_TOKEN_SECRET:}
    token-ttl: ${NEXORA_WOPI_TOKEN_TTL:10h}
  bootstrap:
    admin-login: ${NEXORA_BOOTSTRAP_ADMIN_LOGIN:admin}
    admin-password: ${NEXORA_BOOTSTRAP_ADMIN_PASSWORD:}
    demo-data: ${NEXORA_DEMO_DATA:false}

logging:
  level:
    nexora.audit: INFO

---
# Local development without Docker: embedded H2 database file and blobs on disk.
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/nexora;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
nexora:
  storage:
    type: filesystem
  bootstrap:
    admin-password: ${NEXORA_BOOTSTRAP_ADMIN_PASSWORD:admin}
    demo-data: ${NEXORA_DEMO_DATA:true}
